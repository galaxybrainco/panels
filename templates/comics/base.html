{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Panels{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/reader.css' %}">
</head>
<body>
  <header class="site-header">
    <nav>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'account_logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
      {% else %}
        <a href="{% url 'account_login' %}">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/reader.js' %}" defer></script>
</body>
</html>
