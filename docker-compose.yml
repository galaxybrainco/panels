services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: panels
      POSTGRES_USER: panels
      POSTGRES_PASSWORD: panels
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panels"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis is optional at first; the DB task backend is the day-one choice.
  # redis:
  #   image: redis:7
  #   ports:
  #     - "6379:6379"

volumes:
  postgres_data:
